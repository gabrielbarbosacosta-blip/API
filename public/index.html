<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta de Processo - PJe</title>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f5f7fb;
        color: #1f2937;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .card {
        width: min(960px, 100%);
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 24px;
      }

      h1 {
        margin-top: 0;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
      }

      input,
      button {
        border-radius: 10px;
        border: 1px solid #d1d5db;
        font-size: 1rem;
        padding: 12px 14px;
      }

      button {
        background: #0f62fe;
        color: #fff;
        border-color: #0f62fe;
        cursor: pointer;
        font-weight: 600;
      }

      button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .hint {
        margin: 10px 0 0;
        color: #4b5563;
      }

      pre {
        margin: 20px 0 0;
        max-height: 500px;
        overflow: auto;
        background: #0b1020;
        color: #e5e7eb;
        border-radius: 10px;
        padding: 16px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .status {
        margin-top: 16px;
        font-weight: 600;
      }

      .status.error {
        color: #b91c1c;
      }

      .status.ok {
        color: #166534;
      }

      @media (max-width: 640px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Consulta de Processo (PJe)</h1>
      <p>Digite o número do processo para buscar as comunicações no Diário.</p>

      <form id="consultaForm" class="row">
        <input
          id="numeroProcesso"
          name="numeroProcesso"
          placeholder="Ex.: 0000000-00.0000.0.00.0000"
          required
        />
        <button id="buscarBtn" type="submit">Buscar</button>
      </form>

      <p class="hint">Endpoint utilizado: <code>GET /processo/:numero</code></p>
      <div id="status" class="status"></div>
      <pre id="resultado">Aguardando consulta...</pre>
    </main>

    <script>
      const form = document.getElementById("consultaForm");
      const input = document.getElementById("numeroProcesso");
      const resultado = document.getElementById("resultado");
      const status = document.getElementById("status");
      const buscarBtn = document.getElementById("buscarBtn");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const numero = input.value.trim();
        if (!numero) {
          status.className = "status error";
          status.textContent = "Informe um número de processo válido.";
          return;
        }

        buscarBtn.disabled = true;
        status.className = "status";
        status.textContent = "Consultando...";
        resultado.textContent = "";

        try {
          const response = await fetch(`/processo/${encodeURIComponent(numero)}`);

          if (!response.ok) {
            throw new Error(`Falha na consulta (${response.status})`);
          }

          const data = await response.json();
          status.className = "status ok";
          status.textContent = "Consulta concluída com sucesso.";
          resultado.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          status.className = "status error";
          status.textContent = `Erro: ${error.message}`;
          resultado.textContent = "Não foi possível obter os dados.";
        } finally {
          buscarBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
