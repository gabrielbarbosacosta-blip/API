limpar_comodo:
  alias: "Limpar Cômodo"
  icon: mdi:robot-vacuum
  mode: single
  fields:
    room_id:
      name: ID do cômodo
      required: true
      selector:
        number:
          min: 1
          max: 99
          mode: box
  sequence:
    - if:
        - condition: not
          conditions:
            - condition: state
              entity_id: vacuum.xiaomi_us_1194749639_ov42gl
              state: "docked"
      then:
        - action: vacuum.stop
          target:
            entity_id: vacuum.xiaomi_us_1194749639_ov42gl
        - delay:
            seconds: 4

    - action: select.select_option
      target:
        entity_id: select.xiaomi_us_1194749639_ov42gl_sweep_mop_type_p_2_4
      data:
        option: "Vacuuming before mopping"

    - action: select.select_option
      target:
        entity_id: select.xiaomi_us_1194749639_ov42gl_mode_p_2_9
      data:
        option: "Standard"

    - action: select.select_option
      target:
        entity_id: select.xiaomi_us_1194749639_ov42gl_sweep_route_p_2_74
      data:
        option: "Careful"

    - action: select.select_option
      target:
        entity_id: select.xiaomi_us_1194749639_ov42gl_clean_times_p_2_8
      data:
        option: "Once"

    - action: select.select_option
      target:
        entity_id: select.xiaomi_us_1194749639_ov42gl_mop_water_output_level_p_2_10
      data:
        option: "Level 3"

    - delay:
        seconds: 2

    - action: system_log.write
      data:
        level: warning
        logger: vacuum_clean_debug
        message: "CLEAN_ROOM room_id={{ room_id }} mode={{ states('select.xiaomi_us_1194749639_ov42gl_sweep_mop_type_p_2_4') }} route={{ states('select.xiaomi_us_1194749639_ov42gl_sweep_route_p_2_74') }} water={{ states('select.xiaomi_us_1194749639_ov42gl_mop_water_output_level_p_2_10') }}"

    - action: notify.send_message
      target:
        entity_id: notify.xiaomi_us_1194749639_ov42gl_start_vacuum_room_sweep_a_2_16
      data:
        message: "{{ room_id | int }}"


limpeza_completa:
  alias: "Limpeza Completa"
  icon: mdi:home-heart
  mode: single
  sequence:
    - if:
        - condition: not
          conditions:
            - condition: state
              entity_id: vacuum.xiaomi_us_1194749639_ov42gl
              state: "docked"
      then:
        - action: vacuum.stop
          target:
            entity_id: vacuum.xiaomi_us_1194749639_ov42gl
        - delay:
            seconds: 4

    - action: select.select_option
      target:
        entity_id: select.xiaomi_us_1194749639_ov42gl_sweep_mop_type_p_2_4
      data:
        option: "Vacuuming before mopping"

    - action: select.select_option
      target:
        entity_id: select.xiaomi_us_1194749639_ov42gl_mode_p_2_9
      data:
        option: "Standard"

    - action: select.select_option
      target:
        entity_id: select.xiaomi_us_1194749639_ov42gl_sweep_route_p_2_74
      data:
        option: "Careful"

    - action: select.select_option
      target:
        entity_id: select.xiaomi_us_1194749639_ov42gl_clean_times_p_2_8
      data:
        option: "Once"

    - action: select.select_option
      target:
        entity_id: select.xiaomi_us_1194749639_ov42gl_mop_water_output_level_p_2_10
      data:
        option: "Level 3"

    - delay:
        seconds: 2

    - action: system_log.write
      data:
        level: warning
        logger: vacuum_clean_debug
        message: "FULL_CLEAN mode={{ states('select.xiaomi_us_1194749639_ov42gl_sweep_mop_type_p_2_4') }} route={{ states('select.xiaomi_us_1194749639_ov42gl_sweep_route_p_2_74') }} water={{ states('select.xiaomi_us_1194749639_ov42gl_mop_water_output_level_p_2_10') }}"

    - action: vacuum.start
      target:
        entity_id: vacuum.xiaomi_us_1194749639_ov42gl


cancelar_limpeza:
  alias: "Cancelar Limpeza"
  icon: mdi:home-import-outline
  mode: single
  sequence:
    - action: system_log.write
      data:
        level: warning
        logger: vacuum_cancel_debug
        message: "CANCEL_REQUEST state={{ states('vacuum.xiaomi_us_1194749639_ov42gl') }}"

    - action: vacuum.return_to_base
      target:
        entity_id: vacuum.xiaomi_us_1194749639_ov42gl

    - delay:
        seconds: 2

    - action: system_log.write
      data:
        level: warning
        logger: vacuum_cancel_debug
        message: "CANCEL_RESULT state={{ states('vacuum.xiaomi_us_1194749639_ov42gl') }}"
