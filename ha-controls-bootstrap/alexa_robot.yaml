automation:
  - id: alexa_robot_webhook
    alias: "Alexa - Controle do Robô"
    mode: queued
    max: 3
    trigger:
      - platform: webhook
        webhook_id: "__ALEXA_WEBHOOK_ID__"
        allowed_methods:
          - POST
        local_only: false

    variables:
      command: "{{ trigger.json.action | default('') }}"
      room: "{{ trigger.json.room | default('') }}"
      room_map:
        sala: 3
        quarto: 4
        escritorio: 5
        cozinha: 10
        banheiro: 7
        banheiro_1: 8
        corredor: 9
      room_id: "{{ room_map.get(room, 0) }}"

    action:
      - action: system_log.write
        data:
          level: warning
          logger: alexa_robot_webhook
          message: "WEBHOOK_COMMAND action={{ command }} room={{ room }} room_id={{ room_id }}"

      - choose:
          - conditions: "{{ command == 'limpar_comodo' and (room_id | int) > 0 }}"
            sequence:
              - action: script.limpar_comodo
                data:
                  room_id: "{{ room_id | int }}"

          - conditions: "{{ command == 'limpeza_completa' }}"
            sequence:
              - action: script.limpeza_completa

          - conditions: "{{ command == 'cancelar_limpeza' }}"
            sequence:
              - action: script.cancelar_limpeza

        default:
          - action: system_log.write
            data:
              level: warning
              logger: alexa_robot_webhook
              message: "Comando Alexa ignorado: action={{ command }} room={{ room }}"
