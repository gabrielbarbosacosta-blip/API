automation:
  - id: alexa_robot_webhook
    alias: "Alexa - Controle do Robô"
    mode: queued
    max: 3
    trigger:
      - platform: webhook
        webhook_id: "__ALEXA_WEBHOOK_ID__"
        allowed_methods:
          - POST
        local_only: false

    variables:
      command: "{{ trigger.json.action | default('') }}"
      room: "{{ trigger.json.room | default('') }}"
      room_map:
        sala: 3
        quarto: 4
        escritorio: 5
        cozinha: 10
        banheiro: 7
        banheiro_1: 8
        corredor: 9
      room_id: "{{ room_map.get(room, 0) }}"

    action:
      - action: system_log.write
        data:
          level: warning
          logger: alexa_robot_webhook
          message: "WEBHOOK_COMMAND action={{ command }} room={{ room }} room_id={{ room_id }}"

      - choose:
          - conditions: "{{ command == 'limpar_comodo' and (room_id | int) > 0 }}"
            sequence:
              - action: script.limpar_comodo
                data:
                  room_id: "{{ room_id | int }}"

          - conditions: "{{ command == 'limpeza_completa' }}"
            sequence:
              - action: script.limpeza_completa

          - conditions: "{{ command == 'cancelar_limpeza' }}"
            sequence:
              - action: script.cancelar_limpeza

        default:
          - action: system_log.write
            data:
              level: warning
              logger: alexa_robot_webhook
              message: "Comando Alexa ignorado: action={{ command }} room={{ room }}"

  - id: robot_cleaning_completed_announce
    alias: "Robô - Avisar conclusão da limpeza"
    mode: restart
    trigger:
      - platform: state
        entity_id: vacuum.xiaomi_us_1194749639_ov42gl
        to: "docked"

    condition:
      - condition: state
        entity_id: input_boolean.robot_cleaning_active
        state: "on"

    variables:
      announce_entity: "{{ state_attr('sensor.alexa_devices_last_called', 'notify_announce') | default('', true) }}"
      target: "{{ states('input_text.robot_cleaning_target') }}"
      started_ts: "{{ states('input_number.robot_cleaning_started_ts') | float(0) }}"
      duration_minutes: >-
        {{ ((as_timestamp(now()) - (started_ts | float(0))) / 60) | round(1) if (started_ts | float(0)) > 0 else 0 }}
      avg_entity: >-
        {% set m = {
          'sala': 'input_number.robot_avg_sala_minutes',
          'quarto': 'input_number.robot_avg_quarto_minutes',
          'escritorio': 'input_number.robot_avg_escritorio_minutes',
          'cozinha': 'input_number.robot_avg_cozinha_minutes',
          'banheiro': 'input_number.robot_avg_banheiro_minutes',
          'banheiro_1': 'input_number.robot_avg_banheiro_1_minutes',
          'corredor': 'input_number.robot_avg_corredor_minutes',
          'limpeza_completa': 'input_number.robot_avg_limpeza_completa_minutes'
        } %}
        {{ m.get(target, '') }}
      count_entity: >-
        {% set m = {
          'sala': 'input_number.robot_count_sala',
          'quarto': 'input_number.robot_count_quarto',
          'escritorio': 'input_number.robot_count_escritorio',
          'cozinha': 'input_number.robot_count_cozinha',
          'banheiro': 'input_number.robot_count_banheiro',
          'banheiro_1': 'input_number.robot_count_banheiro_1',
          'corredor': 'input_number.robot_count_corredor',
          'limpeza_completa': 'input_number.robot_count_limpeza_completa'
        } %}
        {{ m.get(target, '') }}
      old_avg: "{{ states(avg_entity) | float(0) if avg_entity else 0 }}"
      old_count: "{{ states(count_entity) | int(0) if count_entity else 0 }}"
      new_count: "{{ (old_count | int(0)) + 1 }}"
      new_avg: >-
        {% if (duration_minutes | float(0)) > 0 %}
          {% if (old_count | int(0)) > 0 %}
            {{ ((((old_avg | float(0)) * (old_count | int(0))) + (duration_minutes | float(0))) / (new_count | int)) | round(1) }}
          {% else %}
            {{ duration_minutes | float(0) }}
          {% endif %}
        {% else %}
          {{ old_avg | float(0) }}
        {% endif %}

    action:
      - if:
          - condition: template
            value_template: >-
              {{ avg_entity != ''
                 and count_entity != ''
                 and (duration_minutes | float(0)) >= 1
                 and (duration_minutes | float(0)) <= 600 }}
        then:
          - action: input_number.set_value
            target:
              entity_id: "{{ avg_entity }}"
            data:
              value: "{{ new_avg }}"
          - action: input_number.set_value
            target:
              entity_id: "{{ count_entity }}"
            data:
              value: "{{ new_count }}"
          - action: system_log.write
            data:
              level: warning
              logger: vacuum_eta_history
              message: "ETA_HISTORY target={{ target }} duration={{ duration_minutes }} avg={{ new_avg }} samples={{ new_count }}"

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.robot_cleaning_active

      - delay:
          seconds: 2

      - if:
          - condition: template
            value_template: "{{ announce_entity is string and announce_entity.startswith('notify.') }}"
        then:
          - action: notify.send_message
            target:
              entity_id: "{{ announce_entity }}"
            data:
              message: "A limpeza foi concluída e o robô retornou para a base."
        else:
          - action: system_log.write
            data:
              level: warning
              logger: vacuum_completion_announce
              message: "Limpeza concluída, mas nenhum dispositivo Alexa Announce foi encontrado. Configure a integração Alexa Devices."
